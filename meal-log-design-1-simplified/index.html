  --pink-50: #FDEBF4;
  --page: #F7F8FA;          /* Home background */
  --card: #FFFFFF;
  --line: #E2E8F5;          /* card outlines */
  --line-2: #CFD8EA;
  --green: #189C25;         /* "Meal Logged!" badge (screen_7) */
  --green-ink: #157A35;
  --green-50: #EAF7EE;
  --over-ink: #9A4A06;      /* over a limit: amber family + ▲ + words */
  --over: #E07B12;
  --over-50: #FFF2E2;
  --short-ink: #1D52BF;     /* short of a goal: blue family + ▼ + words */
  --short: #3B7BEA;
  --short-50: #EAF1FF;
  --ok-ink: #157A35;
  --ok: #24994A;            /* bar green (screen_9) */
  --peach: #FFF3E7;         /* advice card (screen_9), fun fact (screen_5) */
  --peach-ink: #8A4B12;
  --violet-50: #F3EDFF;     /* migration banner tint (screen_1) */
  --shadow-1: 0 1px 2px rgba(13, 25, 37, .05), 0 6px 18px rgba(13, 25, 37, .06);
  --shadow-2: 0 18px 40px rgba(13, 25, 37, .22);
  --r-hero: 24px;
  --r-card: 18px;
  --r-row: 14px;
  --r-btn: 14px;
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans Bengali', sans-serif;
  --font-head: 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --sb: 50px;               /* status bar height inside the frame */
  --hb: 26px;               /* home-indicator area */
  --fs: 1;                  /* text scale (Design 2's Aa switch) */
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: #E8ECF2;
  font-family: var(--font-ui);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img { display: block; max-width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 10px; }

/* ===== Stage: info panel + phone frame (desktop) ===== */
.stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 56px; padding: 20px; }
.about { width: 340px; color: var(--ink); }
.about .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: calc(13px * var(--fs)); font-weight: 600; color: var(--blue-ink); }
.about h1 { font-family: var(--font-head); font-weight: 600; font-size: calc(28px * var(--fs)); line-height: 1.2; margin: 14px 0 8px; color: var(--navy); }
.about p { margin: 0 0 14px; font-size: calc(15px * var(--fs)); line-height: 1.5; color: var(--text); }
.about h2 { font-size: calc(15px * var(--fs)); margin: 18px 0 8px; color: var(--navy); }
.about ol { margin: 0; padding-left: 20px; font-size: calc(14.5px * var(--fs)); line-height: 1.5; color: var(--text); }
.about ol li { margin-bottom: 6px; }
.about .note { font-size: calc(13px * var(--fs)); color: var(--muted); line-height: 1.45; }
.about .restart { margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--navy); background: var(--card); font-weight: 600; }
.device-wrap { position: relative; flex: none; }
.device { position: absolute; left: 0; top: 0; width: 418px; height: 872px; padding: 14px; border-radius: 64px; background: #11141A; box-shadow: 0 0 0 2px #2E333C inset, 0 40px 90px rgba(13, 25, 37, .35); transform-origin: top left; }
.phone { position: relative; width: 390px; height: 844px; border-radius: 50px; overflow: hidden; background: var(--page); isolation: isolate; }

/* status bar + home indicator */
.statusbar { position: absolute; z-index: 50; top: 0; left: 0; right: 0; height: var(--sb); display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 40px; font-weight: 600; font-size: calc(16px * var(--fs)); pointer-events: none; color: var(--ink); transition: color .2s; }
.statusbar.light { color: #fff; }
.statusbar .island { position: absolute; left: 50%; top: 11px; width: 122px; height: 35px; margin-left: -61px; border-radius: 20px; background: #000; }
.statusbar .sb-right { display: flex; align-items: center; gap: 6px; font-size: calc(14px * var(--fs)); }
.statusbar svg { display: block; }
.homebar { position: absolute; z-index: 50; bottom: 8px; left: 50%; width: 136px; height: 5px; margin-left: -68px; border-radius: 3px; background: #0D1925; opacity: .85; pointer-events: none; }
.homebar.light { background: #fff; }

/* mobile: the page is the phone */
.proto-bar { display: none; }
@media (max-width: 600px) {
  :root { --sb: calc(env(safe-area-inset-top, 0px) + 8px); --hb: calc(env(safe-area-inset-bottom, 0px) + 8px); }
  body { background: var(--page); }
  .stage { display: block; padding: 0; }
  .about { display: none; }
  .device-wrap { width: 100% !important; height: auto !important; }
  .device { position: static; width: 100%; height: auto; padding: 0; border-radius: 0; background: none; box-shadow: none; transform: none !important; }
  .phone { width: 100%; height: calc(100dvh - 34px); border-radius: 0; }
  .statusbar, .homebar { display: none; }
  .proto-bar { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px 0 12px; background: var(--navy); color: #fff; font-size: calc(12.5px * var(--fs)); }
  .proto-bar .grow { flex: 1; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proto-bar button { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; font-size: calc(12.5px * var(--fs)); }
  .proto-bar.hidden { display: none; }
  .proto-bar.hidden ~ .stage .phone { height: 100dvh; }
}

/* ===== Screens ===== */
#screen { position: absolute; inset: 0; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--page); }
.screen.white { background: var(--card); }
.screen.dark { background: #0B1016; color: #fff; }
.screen.enter-fwd { animation: enterFwd .24s ease-out; }
.screen.enter-back { animation: enterBack .24s ease-out; }
@keyframes enterFwd { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }
@keyframes enterBack { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
.body { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.body::-webkit-scrollbar { width: 0; height: 0; }
.pad { padding: 0 20px; }
.footer { flex: none; padding: 12px 20px calc(var(--hb) + 8px); background: var(--card); border-top: 1px solid var(--line); }
.footer.clear { background: transparent; border-top: 0; }
.footer .hint { margin: 0 0 8px; text-align: center; font-size: calc(14px * var(--fs)); color: var(--muted); }

/* top bar (white screens) */
.topbar { flex: none; display: flex; align-items: center; gap: 4px; min-height: calc(var(--sb) + 56px); padding: var(--sb) 8px 0; background: var(--card); border-bottom: 1px solid var(--line); }
.topbar.plain { border-bottom: 0; }
.topbar .title { flex: 1; min-width: 0; font-size: calc(18px * var(--fs)); font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .title small { display: block; font-size: calc(13px * var(--fs)); font-weight: 500; color: var(--muted); }
.topbar.center .title { text-align: center; }
.iconbtn { flex: none; width: 44px; height: 44px; display: inline-grid; place-items: center; border: 0; border-radius: 12px; background: transparent; color: var(--ink); }
.iconbtn:active { background: var(--blue-50); }
.textbtn { flex: none; min-height: 44px; padding: 0 12px; border: 0; background: transparent; font-weight: 600; font-size: calc(16px * var(--fs)); color: var(--pink); border-radius: 12px; }
.textbtn.blue { color: var(--blue-ink); }
.textbtn.dark { color: var(--ink); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; padding: 0 20px; border-radius: var(--r-btn); border: 0; background: var(--navy); color: #fff; font-weight: 600; font-size: calc(17px * var(--fs)); letter-spacing: .1px; transition: transform .08s, background .2s, opacity .2s; }
.btn:active { transform: scale(.985); }
.btn[disabled], .btn.is-disabled, .btn[aria-disabled="true"] { background: #C9D0DA; color: #fff; cursor: not-allowed; }
.btn.secondary { background: var(--card); color: var(--navy); border: 1.5px solid var(--navy); }
.btn.soft { background: var(--blue-50); color: var(--blue-ink); }
.btn.danger { background: var(--card); color: #B42318; border: 1.5px solid #F1C6C2; }
.btn.small { min-height: 48px; font-size: calc(16px * var(--fs)); }
.btn .ic { width: 20px; height: 20px; }
.btnrow { display: flex; gap: 10px; }
.btnrow > * { flex: 1; }

/* icons */
.ic { width: 24px; height: 24px; flex: none; }

/* cards + type */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); }
.h-section { font-family: var(--font-head); font-weight: 600; font-size: calc(18px * var(--fs)); color: var(--navy); margin: 0; }
.muted { color: var(--muted); }
.small { font-size: calc(14px * var(--fs)); }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line-2); background: var(--card); font-weight: 600; font-size: calc(15px * var(--fs)); color: var(--ink); white-space: nowrap; }
.chip.on { border-color: var(--blue); background: var(--blue-50); color: var(--blue-ink); }
.chip .ic { width: 18px; height: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; margin: 0 -20px; padding-left: 20px; padding-right: 20px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }

/* confidence labels — always a word plus a shape */
.conf { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 999px; font-size: calc(13px * var(--fs)); font-weight: 600; white-space: nowrap; }
.conf .ic { width: 15px; height: 15px; }
.conf.likely { background: var(--green-50); color: var(--green-ink); }
.conf.notsure { background: var(--over-50); color: var(--over-ink); }
.conf.unlikely { background: #F1F3F6; color: var(--muted); }
.conf.checked { background: var(--blue-50); color: var(--blue-ink); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .25; }
.dots i.f { opacity: 1; }

/* stepper */
.stepper { display: flex; align-items: center; gap: 10px; }
.step-btn { width: 52px; height: 52px; border-radius: 16px; border: 0; background: var(--blue-50); color: var(--navy); display: grid; place-items: center; }
.step-btn:active { background: var(--blue-100); }
.step-btn[disabled] { opacity: .35; cursor: not-allowed; }
.step-btn .ic { width: 26px; height: 26px; stroke-width: 2.4; }
.step-val { min-width: 92px; text-align: center; line-height: 1.05; }
.step-val b { display: block; font-size: calc(28px * var(--fs)); font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
.step-val span { display: block; font-size: calc(14px * var(--fs)); color: var(--muted); margin-top: 2px; }
.step-val.empty b { color: var(--faint); }

/* bottom sheet + scrim */
#overlay:empty { display: none; }
.scrim { position: absolute; inset: 0; z-index: 60; background: rgba(13, 25, 37, .45); }
.scrim.anim { animation: fadeIn .18s ease-out; }
.sheet { position: absolute; z-index: 61; left: 0; right: 0; bottom: 0; max-height: 86%; display: flex; flex-direction: column; background: var(--card); border-radius: 26px 26px 0 0; box-shadow: var(--shadow-2); }
.sheet.anim { animation: sheetUp .24s cubic-bezier(.2, .8, .2, 1); }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: #B7BFCA; margin: 10px auto 4px; flex: none; }
.sheet .sheet-head { display: flex; align-items: center; gap: 8px; padding: 6px 12px 4px 20px; }
.sheet .sheet-head h2 { flex: 1; margin: 0; font-family: var(--font-head); font-weight: 600; font-size: calc(20px * var(--fs)); color: var(--navy); }
.sheet .sheet-body { overflow-y: auto; padding: 4px 20px 12px; }
.sheet .sheet-foot { padding: 8px 20px calc(var(--hb) + 10px); }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* toast */
.toast { position: absolute; z-index: 70; left: 16px; right: 16px; bottom: calc(var(--hb) + 86px); display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 8px 8px 16px; border-radius: 14px; background: var(--navy); color: #fff; box-shadow: var(--shadow-2); font-size: calc(15px * var(--fs)); animation: toastIn .2s ease-out; }
.toast .msg { flex: 1; }
.toast button { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: rgba(255,255,255,.14); color: #fff; font-weight: 700; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* list rows */
.row { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border-radius: var(--r-row); border: 1px solid var(--line); background: var(--card); text-align: left; width: 100%; }
.row .grow { flex: 1; min-width: 0; }
.row .t { display: block; font-weight: 600; font-size: calc(16px * var(--fs)); color: var(--ink); }
.row .s { display: block; font-size: calc(14px * var(--fs)); color: var(--muted); margin-top: 2px; }
.radio { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-2); flex: none; display: grid; place-items: center; }
.on > .radio, .radio.on { border-color: var(--blue); }
.on > .radio::after, .radio.on::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--blue); }
.check { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--line-2); flex: none; display: grid; place-items: center; color: #fff; }
.check.on { background: var(--blue); border-color: var(--blue); }
.check .ic { width: 18px; height: 18px; stroke-width: 3; }

/* nutrient status — word + shape + colour */
.status { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: calc(14px * var(--fs)); white-space: nowrap; }
.status .ic { width: 14px; height: 14px; }
.status.over { color: var(--over-ink); }
.status.short { color: var(--short-ink); }
.status.ok { color: var(--ok-ink); }
.nbar { position: relative; height: 10px; border-radius: 6px; background: #E8EBF0; overflow: visible; }
.nbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.nbar .fill.over { background: var(--over); }
.nbar .fill.short { background: var(--short); }
.nbar .fill.ok { background: var(--ok); }
.nbar .fill .past { position: absolute; top: 0; bottom: 0; right: 0; border-radius: 0 6px 6px 0; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.55) 0 3px, transparent 3px 7px); }
.nbar .target { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--navy); border-radius: 1px; }
.nbar .target::after { content: attr(data-label); position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: calc(11px * var(--fs)); font-weight: 600; color: var(--muted); white-space: nowrap; }

/* photos */
.photo { position: relative; width: 100%; aspect-ratio: 5 / 4; border-radius: 20px; overflow: hidden; background: #2A2F36; }
.photo > svg, .photo > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb { width: 56px; height: 56px; border-radius: 12px; overflow: hidden; position: relative; flex: none; background: #2A2F36; }
.thumb > svg, .thumb > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* bottom navigation (Home) */
.tabbar { flex: none; display: flex; padding: 6px 4px calc(var(--hb) - 2px); background: var(--card); border-top: 1px solid var(--line); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; border: 0; background: transparent; color: #7A818C; font-size: calc(12px * var(--fs)); font-weight: 500; border-radius: 12px; }
.tab.on { color: var(--blue); }
.tab .ic { width: 26px; height: 26px; }

/* navy header with pattern (Home) */
.navyhead { position: relative; flex: none; background: var(--navy); color: #fff; padding: calc(var(--sb) + 10px) 20px 46px; border-radius: 0 0 26px 26px; overflow: hidden; }
.navyhead .pattern { position: absolute; inset: 0; opacity: .09; pointer-events: none; }
.navyhead .hello { position: relative; display: flex; align-items: center; gap: 14px; }
.avatar { width: 54px; height: 54px; border-radius: 50%; background: #EEF3FA; color: var(--blue); display: grid; place-items: center; font-size: calc(22px * var(--fs)); font-weight: 600; flex: none; }
.hello .who { flex: 1; min-width: 0; }
.hello .who b { display: block; font-size: calc(22px * var(--fs)); font-weight: 600; letter-spacing: .1px; }
.hello .who span { font-size: calc(15px * var(--fs)); color: #C5D0DE; }
.headbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: rgba(255,255,255,.12); color: #fff; font-weight: 600; font-size: calc(15px * var(--fs)); }
.headbtn .ic { width: 20px; height: 20px; }

/* small helpers */
.sep { height: 1px; background: var(--line); margin: 14px 0; }
.kcal { font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

/* ===== Screens shared by both designs: Home pieces, camera, analysing, voice, search, feedback ===== */
/* Home */
.sbfill { position: absolute; z-index: 5; top: 0; left: 0; right: 0; height: var(--sb); background: var(--navy); pointer-events: none; }
.lift { position: relative; margin-top: -30px; padding-bottom: 20px; }
.logcard { padding: 22px 18px 18px; border-radius: var(--r-hero); box-shadow: var(--shadow-1); border-color: transparent; }
.logcard h1 { margin: 0 0 6px; font-family: var(--font-head); font-weight: 600; font-size: calc(26px * var(--fs)); line-height: 1.2; color: var(--navy); }
.today { margin-top: 14px; padding: 16px 16px 6px; }
.today-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.today-head .kcal { font-size: calc(15px * var(--fs)); color: var(--muted); }
.today-head .kcal b { color: var(--ink); font-size: calc(17px * var(--fs)); }
.daybar { height: 8px; border-radius: 4px; background: #E8EBF0; margin: 10px 0 6px; overflow: hidden; }
.daybar i { display: block; height: 100%; background: var(--blue); border-radius: 4px; }
.mealrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.mealrow:first-of-type { border-top: 0; }
.mealrow .grow { flex: 1; min-width: 0; }
.mealrow .t { font-weight: 600; font-size: calc(16px * var(--fs)); }
.mealrow .s { font-size: calc(14px * var(--fs)); color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mealrow .kc { font-size: calc(15px * var(--fs)); font-weight: 600; color: var(--text); }
.nudge { margin: 2px 0 10px; font-size: calc(14.5px * var(--fs)); color: var(--muted); }
.pbnote { display: flex; align-items: center; gap: 6px; margin-top: 14px; padding: 10px 6px 10px 16px; border-radius: 16px; background: linear-gradient(100deg, #F3EDFF, #FBF3FF); font-size: calc(14.5px * var(--fs)); line-height: 1.4; color: var(--text); }
.pbnote .grow { flex: 1; }
.linkbtn { display: inline; min-height: 0; padding: 0 0 0 4px; border: 0; background: none; color: var(--pink); font-weight: 600; font-size: inherit; }
.essentials-h { margin: 24px 0 12px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; border: 0; background: none; font-size: calc(13.5px * var(--fs)); color: var(--text); }
.tile .ti { width: 74px; height: 74px; border-radius: 18px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
.tile .ti svg { width: 36px; height: 36px; }
.trackers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
.tracker { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.tr-h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: calc(16px * var(--fs)); }
.tr-h .ic { width: 20px; height: 20px; color: var(--blue); }
.tr-v { font-size: calc(14px * var(--fs)); color: var(--muted); }
.tr-v b { color: var(--ink); font-size: calc(18px * var(--fs)); }
.tr-ctl { display: flex; gap: 10px; }
.tr-ctl .step-btn { width: 48px; height: 48px; }
/* Camera */
.cam { overflow: hidden; }

function confPill(c) {
  if (c === 'likely') return `<span class="conf likely">${icon('check')}Likely</span>`;
  if (c === 'notsure') return `<span class="conf notsure">${icon('help')}Not sure</span>`;
  if (c === 'checked') return `<span class="conf checked">${icon('check')}Checked by you</span>`;
  if (c === 'heard') return `<span class="conf checked">${icon('mic')}Heard</span>`;
  return '';
}
function whyText(d) {
  if (d.mealWhy === 'photo') return `Photo taken at ${fmtTime(d.photoTime)}, so we picked ${mealName(guessMeal(d.photoTime))}.`;
  if (d.mealWhy === 'now') return `It’s ${fmtTime(d.startedAt)} now, so we picked ${mealName(guessMeal(d.startedAt))}.`;
  return 'Check the meal and the time before you save.';
}
function newDraft(source, extra = {}) {
  const t = extra.photoTime || now();
  return Object.assign({ source, photo: null, photoTime: null, items: [], kinds: [], steps: ['confirm', 'meal'], step: 0,
    meal: guessMeal(t), mealWhy: extra.photoTime ? 'photo' : 'now', time: t, startedAt: now(), timeEditing: false, heard: '', editingId: null, undone: false }, extra);
}
function draftFromMeal(m) {
  return { source: m.source, photo: m.photo, photoTime: m.photoTime || null, items: m.items.map(i => Object.assign({}, i, { id: uid(), alts: i.alts || [], conf: i.conf === 'notsure' ? 'notsure' : (i.conf || 'chosen') })), kinds: [], steps: ['confirm', 'meal'], step: 1,
    meal: m.meal, mealWhy: 'user', time: new Date(m.time), startedAt: now(), timeEditing: false, heard: m.heard || '', editingId: m.id, undone: false };
}

/* ---------- the question screens ---------- */
App.screens.q = () => {

  let main = '', foot = '';
  if (name === 'confirm') [main, foot] = qConfirm(d);

  if (name === 'howmany') [main, foot] = qHowMany(d);
  if (name === 'meal') [main, foot] = qMeal(d);
  return `<section class="screen white">
  <header class="topbar"><button class="iconbtn" data-act="qBack" aria-label="Back">${icon('chevL')}</button><div class="title center">${progress}</div><button class="textbtn" data-act="discard">Cancel</button></header>

  <div class="footer">${foot}</div>

};
function context(d) {
  if (d.photo) return `<div class="qctx">${photo(d.photo, 'thumb')}<span>${d.photoTime && d.mealWhy === 'photo' ? `Your photo from ${fmtTime(d.photoTime)}` : 'Your photo'}</span></div>`;
  if (d.source === 'voice') return `<div class="qctx"><span class="ctxic">${icon('mic')}</span><span>You said: “${esc(d.heard)}”</span></div>`;
  if (d.source === 'search') return `<div class="qctx"><span class="ctxic">${icon('search')}</span><span>Foods you picked in Search</span></div>`;
  return '';
}
function foodRow(it, opts = {}) {
  const fd = FOODS[it.food]; const kc = itemKcal(it);
  const alt = it.conf === 'notsure' && (it.alts || []).length ? `<p class="maybe">${icon('help')}Could also be ${esc(joinAnd(it.alts.slice(0, 2).map(a => FOODS[a].name)))}.</p>` : '';
  return `<div class="fooditem" id="fi-${it.id}">
    <div class="fi-top"><span class="fi-name">${esc(fd.name)}</span>${confPill(it.conf)}</div>
    <div class="fi-mid">${stepper(it)}<div class="fi-kcal"><b class="kcal">${kc} kcal</b><span>${r0(fd.kcal)} kcal ${fd.kind === 'count' ? 'each' : 'a ' + esc(fd.unit)}</span></div></div>
    ${alt}
    <div class="fi-bot"><button class="textbtn" data-act="changeItem" data-id="${it.id}">Change</button></div>
  </div>`;
}
function stepper(it) {
  const fd = FOODS[it.food]; const q = it.qty || 0;
  return `<div class="stepper" role="group" aria-label="Amount of ${esc(fd.name)}"><button class="step-btn" data-act="dec" data-id="${it.id}" data-fk="dec-${it.id}" aria-label="Less ${esc(fd.name)}" ${q && canStepDown(it.food, q) ? '' : 'disabled'}>${icon('minus')}</button><div class="step-val ${q ? '' : 'empty'}" aria-live="polite"><b>${q ? fmtNum(q) : '—'}</b><span>${esc(q ? unitWord(fd, q) : fd.units || fd.unit)}</span></div><button class="step-btn" data-act="inc" data-id="${it.id}" data-fk="inc-${it.id}" aria-label="More ${esc(fd.name)}">${icon('plus')}</button></div>`;
}
function totalLine(items) { return `<div class="totline"><span>Total</span><b class="kcal">${r0(totals(items).kcal)} kcal</b></div>`; }
function qConfirm(d) {
  const nNot = d.items.filter(i => i.conf === 'notsure').length;
  const title = d.source === 'search' ? 'How much did you eat?' : 'Is this what you ate?';
  const hint = d.source === 'search' ? 'Use − and + to set how much you had.' : d.source === 'voice' ? 'Here’s what we heard. Check the amounts.' : `We found ${d.items.length} food${d.items.length === 1 ? '' : 's'} in your photo. Check the amounts.${nNot ? ` We’re not sure about ${nNot === 1 ? 'one of them' : nNot + ' of them'} — tap “Change” to pick another.` : ''}`;
  const main = `<h1 class="qtitle">${title}</h1><p class="qhint">${hint}</p>${d.items.map(i => foodRow(i)).join('')}<button class="addfood" data-act="addFood">${icon('plus')}Add a food</button>`;
  const ok = d.items.length > 0;
  const foot = `${totalLine(d.items)}<button class="btn" data-act="next" ${ok ? '' : 'aria-disabled="true" data-why="Add at least one food first."'}>${d.source === 'search' ? 'Next' : 'Yes, that’s what I ate'}</button>`;
  return [main, foot];
}
function qWhich(d) {
  const picked = d.kinds.filter(k => k.picked).length;
  const cards = d.kinds.map(k => { const fd = FOODS[k.food]; return `<button class="kind ${k.picked ? 'on' : ''}" data-act="toggleKind" data-id="${k.id}" aria-pressed="${!!k.picked}">
      ${k.crop ? `<span class="kcrop"><img src="${ART[k.crop]}" alt="Close-up from your photo: ${esc(k.look || fd.name)}"></span>` : `<span class="kcrop icon">${icon('search')}</span>`}
      <span class="ktext"><span class="klook">${esc(k.look || 'Added by you')}</span><b>${k.conf === 'checked' || k.conf === 'chosen' ? '' : 'We think: '}${esc(fd.name)}</b>${k.seen ? `<span class="kseen">We can see about ${k.seen}</span>` : ''}<span class="kconf">${confPill(k.conf)}</span></span>
      <span class="check ${k.picked ? 'on' : ''}">${k.picked ? icon('check') : ''}</span></button>
      ${(k.alts || []).length ? `<button class="textbtn notthis" data-act="notThis" data-id="${k.id}">Not ${esc(fd.name)}? Pick another</button>` : ''}`; }).join('');
  const main = `<h1 class="qtitle">Which ones did you eat?</h1><p class="qhint">We’re not sure. We can see ${d.kinds.filter(k => k.seen).length} kinds in your photo — choose all that you ate.</p><div class="kinds">${cards}</div><button class="addfood" data-act="somethingElse">${icon('search')}Something else — search for it</button>`;
  const foot = `${picked ? '' : '<p class="hint">Choose at least one to continue.</p>'}<button class="btn" data-act="next" ${picked ? '' : 'aria-disabled="true" data-why="Choose at least one kind first."'}>Next</button>`;
  return [main, foot];
}
function qHowMany(d) {
  const totalSeen = d.items.reduce((a, i) => a + (i.seen || 0), 0);
  const cards = d.items.map(it => { const fd = FOODS[it.food]; const q = it.qty || 0; return `<div class="countcard">
      <div class="cc-top">${it.crop ? `<span class="kcrop sm"><img src="${ART[it.crop]}" alt=""></span>` : ''}<span><b>${esc(fd.name)}</b>${it.seen ? `<span class="kseen">We can see about ${it.seen} of these</span>` : ''}</span></div>
      <div class="quick" role="group" aria-label="How many ${esc(fd.units || fd.unit)}">${[1, 2, 3, 4, 5, 6].map(n => `<button class="qn ${q === n ? 'on' : ''}" data-act="setQty" data-id="${it.id}" data-q="${n}" aria-pressed="${q === n}">${n}</button>`).join('')}</div>
      <div class="cc-mid">${stepper(it)}<div class="fi-kcal">${q ? `<b class="kcal">${itemKcal(it)} kcal</b><span>${fmtQty(it.food, q)}, ${r0(fd.kcal)} kcal each</span>` : `<b class="pending">Choose a number</b><span>${r0(fd.kcal)} kcal each</span>`}</div></div>
    </div>`; }).join('');
  const ok = d.items.length && d.items.every(i => (i.qty || 0) > 0);
  const main = `<h1 class="qtitle">How many did you eat?</h1><p class="qhint">${totalSeen ? `We can see about ${totalSeen} in the ${d.photo === 'tin' ? 'tin' : 'photo'}. ` : ''}Count only the ones you ate.</p>${cards}`;
  const foot = `${ok ? totalLine(d.items) : '<p class="hint">Choose how many you ate to continue.</p>'}<button class="btn" data-act="next" ${ok ? '' : 'aria-disabled="true" data-why="Choose how many you ate first."'}>Next</button>`;
  return [main, foot];
}
function qMeal(d) {
  const g = d.mealWhy === 'photo' ? guessMeal(d.photoTime) : d.mealWhy === 'now' ? guessMeal(d.startedAt) : null;
  const opts = MEALS.map(m => `<button class="mealopt ${d.meal === m.key ? 'on' : ''}" data-act="pickMeal" data-k="${m.key}" role="radio" aria-checked="${d.meal === m.key}"><span class="radio"></span><span class="grow"><b>${m.name}</b><span>${m.range}</span></span>${g === m.key ? '<span class="guess">Our guess</span>' : ''}</button>`).join('');
  const sum = d.items.filter(i => i.qty > 0).map(i => `<li><span>${esc(describe(i.food, i.qty))}</span><b class="kcal">${itemKcal(i)} kcal</b></li>`).join('');

function nutrientRow(r) {
  const val = r.key === 'kcal' ? `${r0(r.val)} of ${r.target} kcal` : `${r0(r.val)} of ${r.target} g`;
  const st = r.status === 'over' ? `<span class="status over">${icon('up')}${r.diff} ${r.unit} over</span>` : r.status === 'short' ? `<span class="status short">${icon('down')}${r.diff} ${r.unit} short</span>` : `<span class="status ok">${icon('okc')}${r.kind === 'goal' && r.val >= r.target ? 'goal met' : 'on target'}</span>`;
  const scaleMax = Math.max(1.5, r.pct);

  return `<div class="nrow"><div class="nrow-top"><span class="nlab">${r.label}</span><span class="nval kcal">${val}</span>${st}</div><div class="nbar" aria-hidden="true"><span class="fill ${r.status}" style="width:${fillW}%">${past}</span><span class="target" style="left:calc(${tgt}% - 1px)"></span></div></div>`;
}

  App.sheet = null;
  if (d.m === 'photo') { S.draft = null; go('photo'); }
  if (d.m === 'voice') { S.voice = Object.assign(S.voice, { phase: 'idle', transcript: '', sample: null, typing: false, text: '' }); go('voice'); }
  if (d.m === 'search') { S.search = { q: '', mode: 'new', picked: [], targetId: null, back: 'home' }; go('search'); }
};
/* photo */
A.scene = d => { S.scene = d.k; render(); };
A.hideTips = () => { S.tips = false; render(); };
A.cancelPhoto = () => go('home', 'back');
A.shoot = () => startAnalysis(S.scene, null);
A.gallery = () => openSheet(() => `<div class="grab"></div><div class="sheet-head"><h2>Your photos</h2><button class="iconbtn" data-act="closeSheet" aria-label="Close">${icon('x')}</button></div><div class="sheet-body"><p class="small muted" style="margin:0 0 12px">Today. The time a photo was taken becomes the meal time — you can change it later.</p><div class="gallery">${GALLERY.slice().reverse().map(g => `<button class="gitem" data-act="pickPhoto" data-k="${g.key}">${photo(g.key, 'gimg')}<span>${fmtTime(g.time())}</span></button>`).join('')}</div></div><div class="sheet-foot"><button class="btn secondary" data-act="closeSheet">Cancel</button></div>`);
A.pickPhoto = d => { const g = GALLERY.find(x => x.key === d.k); App.sheet = null; startAnalysis(d.k, g.time()); };
function startAnalysis(key, photoTime) {
  clearTimers(); S.analysing = { key, photoTime, stage: 0 }; go('analysing');
  timers.push(setTimeout(() => { S.analysing.stage = 1; render(); }, 900));
  timers.push(setTimeout(() => { S.analysing.stage = 2; render(); }, 1800));
  timers.push(setTimeout(() => { S.analysing.stage = 3; render(); }, 2600));
  timers.push(setTimeout(() => finishAnalysis(), 3000));
}
A.cancelAnalysis = () => { clearTimers(); go('photo', 'back'); toast('Cancelled. Nothing was saved.'); };
function finishAnalysis() {
  const { key, photoTime } = S.analysing; const res = SCENES[key].result;
  const d = newDraft('photo', { photo: key, photoTime: photoTime || null });
  if (!photoTime) { d.mealWhy = 'now'; d.time = now(); d.meal = guessMeal(d.time); }
  if (res.type === 'confirm') { d.items = res.items.map(mkItem); d.steps = ['confirm', 'meal']; }
  else { d.kinds = res.kinds.map(k => Object.assign(mkItem(k), { picked: false })); d.steps = ['which', 'howmany', 'meal']; }
  S.draft = d; go('q');
}
/* question flow */
A.qBack = () => {
  const d = cur();
  if (d.step > 0) { d.step--; d.timeEditing = false; App.dir = 'back'; App.last = null; App.mem.q = 0; render(); return; }
  if (d.source === 'photo') go('photo', 'back'); else if (d.source === 'voice') go('voice', 'back'); else go('search', 'back');
};
A.discard = () => openSheet(() => `<div class="grab"></div><div class="sheet-head"><h2>Discard this meal?</h2></div><div class="sheet-body"><p style="margin:0 0 6px;font-size:16px;line-height:1.45">Nothing has been saved yet.${cur() && cur().photo ? ' Your photo stays in your phone’s photos.' : ''}</p></div><div class="sheet-foot btnrow"><button class="btn secondary" data-act="closeSheet" data-autofocus>Keep going</button><button class="btn danger" data-act="discardYes">Discard</button></div>`);
A.discardYes = () => { S.draft = null; App.sheet = null; go('home', 'back'); toast('Meal discarded. Nothing was saved.'); };
A.next = () => {
  const d = cur(); const name = stepName();
  if (name === 'which') {
    const picked = d.kinds.filter(k => k.picked);
    const keep = d.items.filter(i => picked.some(k => k.food === i.food));
    d.items = picked.map(k => keep.find(i => i.food === k.food) || Object.assign(mkItem(k), { qty: 0, conf: k.conf, crop: k.crop, seen: k.seen }));
  }
  d.step = Math.min(d.step + 1, d.steps.length - 1); d.timeEditing = false; App.last = null; App.dir = 'fwd'; App.mem.q = 0; render();
};
const itemById = id => cur().items.find(i => i.id === id);
A.inc = d => { const it = itemById(d.id); it.qty = it.qty ? stepUp(it.food, it.qty) : (FOODS[it.food].kind === 'portion' ? 1 : (FOODS[it.food].step || 1)); render(); };
A.dec = d => { const it = itemById(d.id); it.qty = stepDown(it.food, it.qty); render(); };
A.setQty = d => { const it = itemById(d.id); it.qty = Number(d.q); render(); };
A.toggleKind = d => { const k = cur().kinds.find(x => x.id === d.id); k.picked = !k.picked; render(); };
A.notThis = d => { const k = cur().kinds.find(x => x.id === d.id); openSheet(() => altSheet(k, true)); };
A.changeItem = d => { const it = itemById(d.id); openSheet(() => altSheet(it, false)); };
function altSheet(it, isKind) {
  const fd = FOODS[it.food]; const options = [it.food].concat((it.alts || []).filter(a => a !== it.food));
  return `<div class="grab"></div><div class="sheet-head"><h2>Change ${esc(fd.name.toLowerCase())}</h2><button class="iconbtn" data-act="closeSheet" aria-label="Close">${icon('x')}</button></div>
  <div class="sheet-body">${it.conf === 'notsure' ? `<p class="small muted" style="margin:0 0 10px">We’re not sure this is ${esc(fd.name)}. Is it one of these?</p>` : '<p class="small muted" style="margin:0 0 10px">Pick the food you actually ate.</p>'}
    <div class="altlist" role="radiogroup">${options.map(a => `<button class="row ${a === it.food ? 'on' : ''}" data-act="pickAlt" data-id="${it.id}" data-k="${a}" data-kind="${isKind ? 1 : 0}" role="radio" aria-checked="${a === it.food}"><span class="radio"></span><span class="grow"><span class="t">${esc(FOODS[a].name)}</span><span class="s">1 ${esc(FOODS[a].unit)} — ${r0(FOODS[a].kcal)} kcal</span></span></button>`).join('')}</div>
    <button class="addfood" data-act="searchReplace" data-id="${it.id}" data-kind="${isKind ? 1 : 0}">${icon('search')}Search for another food</button>
    ${isKind ? '' : `<div class="sep"></div><button class="btn danger small" data-act="removeItem" data-id="${it.id}">${icon('trash')}Remove this food from the meal</button>`}
  </div>`;
}
A.pickAlt = d => {
  const list = d.kind === '1' ? cur().kinds : cur().items; const it = list.find(x => x.id === d.id);
  const changed = it.food !== d.k; it.food = d.k; it.conf = 'checked'; if (d.kind === '1') it.picked = true;
  App.sheet = null; render(); if (changed) toast(`Changed to ${FOODS[d.k].name}.`);
};
A.removeItem = d => {
  const items = cur().items; const idx = items.findIndex(i => i.id === d.id); const [gone] = items.splice(idx, 1);
  App.sheet = null; render(); toast(`Removed ${FOODS[gone.food].name}.`, 'Undo', () => { cur().items.splice(idx, 0, gone); render(); });
};
A.addFood = () => { S.search = { q: '', mode: 'add', picked: [], targetId: null, back: S.screen }; go('search'); };
A.somethingElse = () => { S.search = { q: '', mode: 'which', picked: [], targetId: null, back: 'q' }; go('search'); };
A.searchReplace = d => { App.sheet = null; S.search = { q: '', mode: 'replace', picked: [], targetId: d.id, kind: d.kind === '1', back: S.screen }; go('search'); };
A.pickMeal = d => { const dr = cur(); dr.meal = d.k; if (dr.mealWhy !== 'user') dr.userPicked = true; render(); };
A.editTime = () => { cur().timeEditing = true; render(); setTimeout(() => { const el = $('.timein'); if (el) el.focus(); }, 30); };
App.inputs.setTime = v => { cur().time = fromInputTime(v); cur().timeEditing = false; render(); };
A.save = () => {
  const d = cur(); if (d.editingId) return A.saveEdit();
  const items = d.items.filter(i => i.qty > 0).map(i => ({ id: i.id, food: i.food, qty: i.qty, conf: i.conf, alts: i.alts || [] }));
  const m = { id: uid('m'), meal: d.meal, time: d.time, items, source: d.source, photo: d.photo, photoTime: d.photoTime, heard: d.heard, history: [] };
  S.meals.push(m); S.savedId = m.id; S.savedMode = 'new'; S.lastDraft = clone(d); S.draft = null; go('saved');
};
A.done = () => { go('home', 'back'); };
A.undoSave = () => {
  const m = mealById(S.savedId); if (!m) return;
  if (S.savedMode === 'updated' && m.history.length) {
    const prev = m.history.pop(); Object.assign(m, prev); S.savedMode = 'new'; render(); toast('Changes undone. The meal is back as it was.'); return;
  }
  S.meals = S.meals.filter(x => x.id !== m.id);
  const d = S.lastDraft ? clone(S.lastDraft) : draftFromMeal(m);
  d.editingId = null; d.step = d.steps.length - 1; d.undone = true; S.draft = d;
  go('q', 'back'); toast(`${mealName(m.meal)} removed from your log. Your answers are kept.`);
};
A.editMeal = d => { const m = mealById(d.id); S.draft = draftFromMeal(m); S.editBack = S.screen; go('edit'); };
A.cancelEdit = () => { S.draft = null; go(S.editBack === 'saved' ? 'saved' : 'home', 'back'); };
A.whenSheet = () => openSheet(() => { const d = cur(); return `<div class="grab"></div><div class="sheet-head"><h2>Meal and time</h2><button class="iconbtn" data-act="closeSheet" aria-label="Close">${icon('x')}</button></div><div class="sheet-body"><div class="mealopts" role="radiogroup">${MEALS.map(m => `<button class="mealopt ${d.meal === m.key ? 'on' : ''}" data-act="pickMeal" data-k="${m.key}" role="radio" aria-checked="${d.meal === m.key}"><span class="radio"></span><span class="grow"><b>${m.name}</b><span>${m.range}</span></span></button>`).join('')}</div><div class="timerow"><span class="grow"><span class="lbl">Time you ate</span><b>${fmtTime(d.time)}</b></span><input type="time" class="timein" value="${toInputTime(d.time)}" data-ch="setTimeSheet" aria-label="Time you ate"></div></div><div class="sheet-foot"><button class="btn" data-act="closeSheet">Done</button></div>`; });
App.inputs.setTimeSheet = v => { cur().time = fromInputTime(v); render(); };
A.saveEdit = () => {
  const d = cur(); const m = mealById(d.editingId);
  const snapshot = { meal: m.meal, time: new Date(m.time), items: m.items.map(i => Object.assign({}, i)) };
  m.history.push(snapshot);
  m.meal = d.meal; m.time = d.time; m.items = d.items.filter(i => i.qty > 0).map(i => ({ id: i.id, food: i.food, qty: i.qty, conf: i.conf, alts: i.alts || [] }));
  S.savedId = m.id; S.savedMode = 'updated'; S.draft = null; go('saved');
};
/* voice */
A.cancelVoice = () => { clearTimers(); go('home', 'back'); };
A.lang = d => { S.voice.lang = d.k; if (S.voice.phase === 'heard') S.voice.phase = 'idle'; render(); };
A.mic = () => { const v = S.voice; if (v.phase === 'idle') { v.phase = 'listening'; render(); } };
A.say = d => {
  const v = S.voice; const smp = VOICE_SAMPLES[v.lang][Number(d.i)]; v.sample = smp; v.phase = 'speaking'; v.transcript = '';
  const words = smp.text.split(' '); let i = 0; clearTimers();
  const tick = () => { i++; v.transcript = words.slice(0, i).join(' '); render(); if (i < words.length) timers.push(setTimeout(tick, 170)); else timers.push(setTimeout(() => { v.phase = 'heard'; render(); }, 450)); };
  tick();
};
A.voiceAgain = () => { Object.assign(S.voice, { phase: 'idle', transcript: '', sample: null }); render(); };
A.toggleTyping = () => { S.voice.typing = !S.voice.typing; render(); if (S.voice.typing) setTimeout(() => { const t = $('#typed'); if (t) t.focus(); }, 40); };
App.inputs.typed = v => { S.voice.text = v; };
A.useHeard = () => { const v = S.voice; startFromWords(v.sample ? v.sample.items : parseMeal(v.transcript), v.transcript); };
A.useTyped = () => { const t = S.voice.text.trim(); if (!t) { toast('Type what you ate first, like “2 roti, 1 katori dal”.'); return; } startFromWords(parseMeal(t), t); };
function startFromWords(found, heard) {
  if (!found.length) { toast('We couldn’t find a food in that. Try other words, or use Search.'); return; }
  const d = newDraft('voice'); d.heard = heard; d.items = found.map(f => mkItem({ food: f.food, qty: f.qty, conf: 'heard', alts: [] })); d.steps = ['confirm', 'meal'];
  S.draft = d; go('q');
}
/* search */
App.inputs.q = v => { S.search.q = v; patch('#results', searchResults()); };
A.pick = d => { const p = S.search.picked; const i = p.indexOf(d.k); if (i >= 0) p.splice(i, 1); else p.push(d.k); render(); };
A.searchBack = () => { const s = S.search; if (s.mode === 'new') go('home', 'back'); else go(s.back, 'back'); };
A.replaceWith = d => {
  const s = S.search; const list = s.kind ? cur().kinds : cur().items; const it = list.find(x => x.id === s.targetId);
  if (it) { it.food = d.k; it.conf = 'checked'; it.alts = []; if (s.kind) it.picked = true; }
  go(s.back, 'back'); toast(`Changed to ${FOODS[d.k].name}.`);
};
A.searchDone = () => {
  const s = S.search;
  if (s.mode === 'new') { const d = newDraft('search'); d.items = s.picked.map(k => mkItem({ food: k, qty: FOODS[k].kind === 'portion' ? 1 : (FOODS[k].step === 0.5 ? 1 : 1), conf: 'chosen' })); S.draft = d; go('q'); return; }
  if (s.mode === 'which') { s.picked.forEach(k => cur().kinds.push(Object.assign(mkItem({ food: k, conf: 'chosen' }), { picked: true, look: 'Added by you' }))); go('q', 'back'); return; }
  s.picked.forEach(k => cur().items.push(mkItem({ food: k, qty: 1, conf: 'chosen' })));
  go(s.back, 'back'); toast(`Added ${s.picked.length} food${s.picked.length === 1 ? '' : 's'}.`);
};

/* ---------- boot ---------- */
function restart() { clearTimers(); hideToast(); LOADED_AT = Date.now(); S = freshState(); App.state = S; App.sheet = null; App.last = null; App.mem = {}; render(); }
document.addEventListener('DOMContentLoaded', () => {
  setupChrome({
    pageTitle: 'Meal Log — Design 1',
    badge: 'Design 1 of 2 — simplified',
    title: 'Ask, don’t assume',
    intro: 'Log one meal in a few one-tap questions. Wherever the app could be wrong — which food, how many, which meal — it asks instead of guessing, then shows everything on one screen after saving.',
    tasks: ['You’ve just finished lunch: 2 rotis, a katori of dal and a katori of bhindi. Log it.', 'You ate 3 biscuits from the tin. Log what you actually ate.', 'At 10:30 AM you had tea with sugar and 2 Marie biscuits and took a photo. Log it now.', 'Read the feedback. How did the meal do? What would you change at dinner?', 'Fix a meal after saving it.'],
    simulated: 'The camera (pick a demo scene), food recognition and voice are simulated. The clock starts at 2:05 PM. Nothing leaves this page and nothing is stored.',
    onRestart: restart,
  });
  bindEvents(); render();
});

</script>
</body>
</html>
