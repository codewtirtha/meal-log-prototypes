<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1925">
<title>Meal log — Flow 2</title>
<meta name="description" content="Clickable prototype for logging a meal with a photo.">
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/theme.css">
<style>
/* ===== Flow 2: Show the estimate. What the app found, what it assumed, how sure it is. ===== */

/* Home: header badge, last-meal strip, one filled "Log a meal" button */
.f2-badge { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; margin-top: 14px; padding: 0 14px 0 6px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, .12); color: #fff; font-size: 16px; font-weight: 600; }
.f2-badge .pb { width: 32px; height: 32px; border-radius: 50%; background: var(--brand-grad); display: grid; place-items: center; }
.f2-badge .pb .ic { width: 18px; height: 18px; color: #fff; }
.f2-top { padding: 18px 20px 0; background: var(--card); }
.f2-last { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 10px 10px 10px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); text-align: left; color: inherit; }
.f2-last .thumb { width: 64px; height: 64px; border-radius: 14px; }
.f2-last .grow { flex: 1; min-width: 0; }
.f2-last .k { display: block; font-size: 16px; font-weight: 600; color: var(--muted); }
.f2-last .t { display: block; margin-top: 2px; font-size: 17px; font-weight: 600; color: var(--ink); }
.f2-last .s { display: block; font-size: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f2-last .chev { color: #A3AAB5; }
.f2-logbtn .ic { width: 24px; height: 24px; }
.hcard .f2-logbtn { margin-top: 12px; }

/* method sheet: equal tiles, each with an accuracy note */
.f2-methods { display: grid; gap: 10px; }
.f2-method { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 84px; padding: 12px 14px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--card); text-align: left; }
.f2-method:active { background: var(--blue-50); }
.f2-method .mi { width: 52px; height: 52px; flex: none; border-radius: 16px; background: var(--blue-50); color: var(--blue); display: grid; place-items: center; }
.f2-method .mi .ic { width: 28px; height: 28px; }
.f2-method .ml { flex: 1; min-width: 0; }
.f2-method .ml b { display: block; font-size: 18px; color: var(--ink); }
.f2-method .ml span { display: block; margin-top: 3px; font-size: 16px; line-height: 1.35; color: var(--muted); }
.f2-method .chev { color: #A3AAB5; }

/* outlines over the photo: positions are in the photo's own pixels (596 x 474) */
.ol-layer { position: absolute; inset: 0; pointer-events: none; }
.ol { position: absolute; border: 2.5px dashed rgba(255, 255, 255, .95); border-radius: 18px; box-shadow: 0 0 0 1px rgba(13, 25, 37, .35), inset 0 0 0 1px rgba(13, 25, 37, .25); }
.ol.round { border-radius: 50%; }
.ol .n { position: absolute; left: -12px; top: -12px; width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 16px; font-weight: 700; box-shadow: 0 0 0 2px #fff; }
.ol .lab { position: absolute; left: 50%; top: -38px; transform: translateX(-50%); white-space: nowrap; padding: 4px 10px; border-radius: 999px; background: rgba(13, 25, 37, .86); color: #fff; font-size: 16px; font-weight: 600; }
.ol .lab.below { top: auto; bottom: -40px; }
.ol-lab { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; padding: 4px 12px; border-radius: 999px; background: rgba(13, 25, 37, .86); color: #fff; font-size: 16px; font-weight: 600; box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
.ol.pop { animation: olPop .35s ease-out; }
@keyframes olPop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; } }
.vf-ol { position: absolute; left: 50%; top: var(--vf-y, 48%); width: 520px; height: 414px; margin: -207px 0 0 -260px; }
.f2-camtools { display: flex; justify-content: center; margin: 0 0 14px; }

/* analysing: stages + foods as they are found */
.f2-stages { list-style: none; margin: 18px 0 14px; padding: 0; display: grid; gap: 12px; }
.f2-stages li { display: flex; align-items: center; gap: 12px; font-size: 17px; color: var(--muted); }
.f2-stages li.now { color: var(--ink); font-weight: 600; }
.f2-stages li.done { color: var(--ink); }
.f2-found { display: grid; gap: 8px; }
.f2-frow { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border-radius: 14px; background: var(--card-grey); animation: toastIn .25s ease-out; }
.f2-frow .nb { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 16px; font-weight: 700; }
.f2-frow .grow { flex: 1; font-weight: 600; font-size: 17px; color: var(--ink); }
.f2-frow .am { font-size: 16px; color: var(--muted); }

/* review rows */
.f2-mealbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 14px 0 10px; }
.f2-row { padding: 14px 14px 12px; margin-bottom: 10px; }
.f2-rtop { display: flex; align-items: flex-start; gap: 10px; }
.f2-rtop .nb { width: 30px; height: 30px; flex: none; margin-top: 1px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 16px; font-weight: 700; }
.f2-rtop .grow { flex: 1; min-width: 0; }
.f2-rtop .nm { display: block; font-size: 18px; font-weight: 600; color: var(--ink); line-height: 1.3; }
.f2-rtop .am { display: block; margin-top: 2px; font-size: 16px; color: var(--muted); }
.f2-rctl { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 0 40px; }
.f2-rctl .kc { font-size: 17px; font-weight: 600; color: var(--text); }
.f2-alts { margin: 10px 0 0 40px; }
.f2-alts .lbl { display: block; margin-bottom: 6px; font-size: 16px; color: var(--muted); }
.f2-add { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; border-radius: 16px; border: 1.5px dashed var(--line-2); background: transparent; color: var(--pink); font-weight: 600; font-size: 17px; }
.f2-add .ic { width: 20px; height: 20px; }
.f2-total { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 2px 4px; font-size: 17px; color: var(--muted); }
.f2-total b { font-size: 20px; color: var(--ink); }

/* saved sheet */
.f2-saved { text-align: center; }
.f2-saved h1 { margin: 12px 0 16px; font-family: var(--font-head); font-weight: 600; font-size: 25px; color: var(--ink); }
.f2-saved .scorebox { text-align: left; }

/* insights */
.f2-gems { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-right: 8px; padding: 0 14px 0 10px; border: 0; border-radius: 999px; background: #fff; box-shadow: var(--shadow-1); font-size: 18px; font-weight: 700; color: var(--ink); }
.f2-gems .ic { width: 22px; height: 22px; }
.f2-tip { position: absolute; z-index: 20; right: 12px; top: calc(var(--sb) + 60px); width: 300px; display: flex; gap: 6px; align-items: flex-start; padding: 12px 6px 12px 14px; border-radius: 16px; background: var(--navy); color: #fff; font-size: 17px; line-height: 1.4; box-shadow: var(--shadow-2); }
.f2-tip::before { content: ''; position: absolute; top: -8px; right: 40px; width: 16px; height: 16px; background: var(--navy); transform: rotate(45deg); border-radius: 3px; }
.f2-tip .linkbtn { display: inline-flex; min-height: 44px; vertical-align: middle; color: #FF8CC6; font-size: 17px; }
.f2-tip .iconbtn { color: #fff; margin-top: -10px; }
.f2-verdict { padding: 16px; }
.f2-vtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.f2-vhead { margin: 10px 0 4px; font-family: var(--font-head); font-weight: 600; font-size: 22px; line-height: 1.3; color: var(--ink); }
.f2-vline { margin: 0 0 4px; font-size: 17px; color: var(--text); }
.f2-nutr { margin-top: 12px; padding: 16px; }
.f2-nutr .h3 { margin-bottom: 14px; }
.f2-assume { margin-top: 12px; padding: 16px; }
.f2-assume .h3 { margin-bottom: 6px; }
.f2-assume li { align-items: flex-start; }
.f2-scorepill { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 14px; border-radius: 999px; background: var(--score-bg); font-size: 16px; color: var(--text); }
.f2-scorepill b { font-size: 18px; color: var(--ink); }
</style>
</head>
<body>
<div class="proto-bar"></div>
<div class="stage">
  <aside class="about" aria-label="Tasks for this prototype"></aside>
  <div class="device-wrap">
    <div class="device">
      <div class="phone" id="phone">
        <div id="sb"></div>
        <div id="screen"></div>
        <div id="overlay"></div>
        <div id="toast" aria-live="polite"></div>
        <div class="homebar"></div>
      </div>
    </div>
  </div>
</div>
<script src="../shared/core.js"></script>
<script src="flow.js"></script>
</body>
</html>
