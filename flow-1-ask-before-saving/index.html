<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1925">
<title>Meal log — Flow 1</title>
<meta name="description" content="Clickable prototype for logging a meal with a photo.">
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/theme.css">
<style>
/* ===== Flow 1: Ask before saving. The photo is a draft; the person confirms amounts. ===== */

/* Home: the one logging button sits under the greeting */
.f1-log { padding: 20px 20px 0; background: var(--card); }
.f1-log .btn { min-height: 60px; font-size: 18px; }
.f1-log .btn .ic { width: 24px; height: 24px; }

/* method sheet: three equally styled tiles with "Best for" hints */
.f1-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding-bottom: 6px; }
.f1-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 172px; padding: 16px 8px 14px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--card); text-align: center; }
.f1-tile:active { background: var(--blue-50); }
.f1-tile .mi { width: 52px; height: 52px; border-radius: 16px; background: var(--blue-50); color: var(--blue); display: grid; place-items: center; }
.f1-tile .mi .ic { width: 28px; height: 28px; }
.f1-tile b { font-size: 18px; color: var(--ink); }
.f1-tile .bf { font-size: 16px; color: var(--muted); line-height: 1.3; }
.f1-tile .bf em { display: block; font-style: normal; color: var(--ink); font-weight: 600; }

/* camera: a slim row of one good and one bad example above the shutter */
.f1-examples { display: flex; gap: 10px; margin: 0 0 16px; }
.f1-ex { flex: 1; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border-radius: 16px; background: rgba(255, 255, 255, .94); color: var(--ink); font-size: 16px; font-weight: 600; line-height: 1.25; }
.f1-ex .ex-img { width: 48px; height: 48px; border-radius: 11px; }
.f1-ex .ex-mark { width: 20px; height: 20px; right: 2px; bottom: 2px; }
.f1-ex .ex-mark .ic { width: 13px; height: 13px; }

/* analysing */
.f1-step { margin: 0; font-size: 18px; line-height: 1.45; color: var(--text); }
.f1-step b { color: var(--ink); }

/* question card */
.f1-q { padding: 16px 16px 18px; margin-top: 14px; }
.f1-ctx { display: flex; align-items: center; gap: 12px; font-size: 16px; color: var(--muted); }
.f1-ctx .thumb { width: 72px; height: 72px; border-radius: 14px; }
.f1-qtitle { margin: 14px 0 18px; font-family: var(--font-head); font-weight: 600; font-size: 25px; line-height: 1.28; color: var(--ink); }
.f1-qsub { margin: 10px 0 0; text-align: center; font-size: 16px; color: var(--muted); }
.f1-links { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-top: 8px; }
.f1-prog { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.f1-prog .pd { display: flex; gap: 6px; }
.f1-prog .pd i { width: 26px; height: 6px; border-radius: 3px; background: var(--line-2); }
.f1-prog .pd i.f { background: var(--blue); }
.f1-prog span { font-size: 16px; font-weight: 600; color: var(--ink); }

/* saved: a sheet over the meal */
.f1-backdrop { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--card); }
.f1-sheet { position: absolute; z-index: 61; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; background: var(--card); border-radius: var(--r-sheet) var(--r-sheet) 0 0; box-shadow: var(--shadow-2); }
.f1-sheet .sheet-head { padding-top: 2px; }
.f1-saved { text-align: center; padding: 0 20px; }
.f1-saved h1 { margin: 12px 0 14px; font-family: var(--font-head); font-weight: 600; font-size: 25px; color: var(--ink); }
.f1-saved .loglist { text-align: left; padding: 2px 14px; border-radius: 16px; background: var(--card-grey); }
.f1-saved .loglist li { border-top-color: #E3E8F2; }
.f1-undo b { font-variant-numeric: tabular-nums; }

/* insights */
.f1-basis { margin: 18px 0 12px; font-family: var(--font-head); font-weight: 600; font-size: 20px; color: var(--ink); }
.f1-kcal { margin-top: 14px; padding: 16px; }
.f1-kcal .big { font-size: 17px; color: var(--text); }
.f1-kcal .big b { font-family: var(--font-head); font-size: 30px; font-weight: 600; color: var(--ink); }
.f1-nutr { margin-top: 12px; padding: 16px; }
.f1-nutr .h3 { margin-bottom: 14px; }
.f1-change { margin: 6px 0 18px; }
.f1-loghead { margin: 18px 0 4px; }
</style>
</head>
<body>
<div class="proto-bar"></div>
<div class="stage">
  <aside class="about" aria-label="Tasks for this prototype"></aside>
  <div class="device-wrap">
    <div class="device">
      <div class="phone" id="phone">
        <div id="sb"></div>
        <div id="screen"></div>
        <div id="overlay"></div>
        <div id="toast" aria-live="polite"></div>
        <div class="homebar"></div>
      </div>
    </div>
  </div>
</div>
<script src="../shared/core.js"></script>
<script src="flow.js"></script>
</body>
</html>
